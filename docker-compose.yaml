# The whole marketing research agent: cockpit, agent and search. One file, one
# command:
#
#     cp .env.example .env   # fill in the keys, first time only
#     docker compose up -d --build
#     open http://localhost:8080
#
#     docker compose down    # stop it; the volumes keep your runs
#
# Two containers, two volumes. Nothing on the host, nothing in systemd, nothing
# that has to be running when you are not using it.
#
# **Superseded:** this stack used to be four containers — the cockpit, its own
# hermes gateway, a one-shot `hermes-config` that pointed hermes at the right
# search backend, and SearXNG. The harness now runs inside the cockpit process
# (pi-agent-core), so `hermes` and `hermes-config` are gone, and with them the
# whole class of failure where the agent's web access depended on which backend
# hermes had auto-detected. See README.md and spec-stage-1.md §10.
name: mra

services:
  # Stage 1 is a web-search agent, so its search tool matters more than most.
  # SearXNG is a self-hosted, free metasearch engine — one container, no API
  # key, no per-query cost. It aggregates Google/Bing/DuckDuckGo/etc without
  # sending your queries to any single one of them as the vendor of record.
  #
  # Search only: SearXNG does not fetch page content, only search results.
  # That's what Firecrawl is for — a cloud API, called directly by `mra`.
  searxng:
    image: searxng/searxng:latest
    container_name: mra-searxng
    restart: on-failure
    expose: ["8080"]              # container network only; never published
    volumes:
      # `use_default_settings: true` inside — a small override, not a fork of
      # SearXNG's own config. See the file for what had to change and why:
      # a stock SearXNG refuses `format=json`, which is the only format the
      # web_search tool asks for.
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      # Real secret, not the placeholder committed in settings.yml.
      - SEARXNG_SECRET=${SEARXNG_SECRET}

  mra:
    build:
      context: .
      dockerfile: Dockerfile
    image: mra:latest
    container_name: mra
    # Not `unless-stopped`: this stack is on-demand, so it should survive a
    # crash without resurrecting itself days after you brought it down.
    #
    # A restart is not free any more. The agent runs inside this container, so
    # restarting kills any run in progress; the server marks such a run
    # `failed` on the way back up rather than leaving it stuck on `running`.
    restart: on-failure
    depends_on: [searxng]
    # Bound to 127.0.0.1, not 0.0.0.0: with no password set
    # (MRA_APP_PASSWORD_HASH below) anyone on your network would otherwise
    # reach an unauthenticated agent with web access.
    #
    # This line is what makes today's answer "reach it directly in a browser"
    # rather than "through a reverse proxy" — the right choice for one person
    # on one laptop. It is also the one line that changes on the day this moves
    # behind a TLS-terminating proxy (Caddy, on the VPS): a published host port
    # and a reverse-proxied container are two different network shapes, and
    # that day's setup will say so rather than silently reusing this file.
    ports: ["127.0.0.1:8080:8000"]
    volumes:
      - mra_data:/data
      # Read-write, where it used to be read-only. The corpus was written by
      # hermes's shell tool and only *read* here; `web_fetch` now writes it
      # directly, so this process owns it. What kept the old arrangement safe
      # is kept explicitly instead: nothing ever executes out of this
      # directory, and the route that serves it back sends `text/plain` with
      # `Content-Security-Policy: default-src 'none'`, so a scraped page cannot
      # become a script on this origin.
      - corpus:/corpus
    environment:
      - MRA_APP_USER=${MRA_APP_USER:-ash}
      - MRA_APP_PASSWORD_HASH=${MRA_APP_PASSWORD_HASH:-}
      - MRA_JWT_SECRET=${MRA_JWT_SECRET}
      # http://localhost cannot set a Secure cookie — a browser silently drops
      # it, so login would appear to succeed and then immediately log you back
      # out. .env.example sets this to false for exactly that reason; flip it
      # back to true (the default here) the day this sits behind real TLS.
      - MRA_COOKIE_SECURE=${MRA_COOKIE_SECURE:-true}
      - MRA_DATABASE_PATH=/data/research.db
      - MRA_CORPUS_PATH=/corpus
      # Inference goes straight to OpenRouter from this process. There is no
      # gateway in between any more, so there is also no gateway default: the
      # model is always named. See .env.example for why this one.
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - MRA_MODEL=${MRA_MODEL:-deepseek/deepseek-v4-flash-0731}
      # Search by service name on this network; page content from Firecrawl's
      # cloud API. Leave FIRECRAWL_API_KEY blank and web_fetch fails loudly on
      # every call, which is more useful than a run that quietly records
      # nothing but search snippets.
      - SEARXNG_URL=http://searxng:8080
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY}

volumes:
  # Runs, events and packets. Losing this loses your research history.
  mra_data: {}
  # Raw fetched bodies, content-addressed. `docker compose exec mra ls
  # /corpus/runs` to look inside.
  corpus: {}
